name: Publish Watch It v1.0.20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.20.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified unsigned production artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cb28-81f4-a624-732e6f9dd14d/raw?se=2026-08-10T00%3A29%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=c8c4628f-da8d-5584-b283-0929e653137e&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A47%3A16Z&ske=2026-08-10T02%3A47%3A16Z&sks=b&skv=2026-02-06&sig=FWmYgFE82M0nYCeiOyH/yVuzoxMwBNAwcKMzwQyZ2jk%3D' -o unsigned.zip
          unzip -q unsigned.zip
          echo '09a78ac9c8876d3e6cebb9da82b42d72f58026b0937cf5c0612842d9f79fc0d6  Watch-It-v1.0.20-PRODUCTION-RC-UNSIGNED.apk' | sha256sum -c -

      - name: Reconstruct exact device-approved signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct

          src = Path('Watch-It-v1.0.20-PRODUCTION-RC-UNSIGNED.apk')
          out = Path('Watch-It-v1.0.20-GitHub.apk')
          unsigned = src.read_bytes()
          expected_unsigned = '09a78ac9c8876d3e6cebb9da82b42d72f58026b0937cf5c0612842d9f79fc0d6'
          expected_signed = '78006aa4a46c039aa866c00dd979546e208f5adbf6ce9ab8ecfb2c6e5fa57943'
          if hashlib.sha256(unsigned).hexdigest() != expected_unsigned:
              raise SystemExit('Unsigned APK digest mismatch')

          block = base64.b64decode('')
          eocd_sig = b'PK\x05\x06'
          eocd = unsigned.rfind(eocd_sig)
          if eocd < 0:
              raise SystemExit('EOCD not found')
          cdoff = struct.unpack_from('<I', unsigned, eocd + 16)[0]
          signed = bytearray(unsigned[:cdoff] + block + unsigned[cdoff:])
          new_eocd = eocd + len(block)
          struct.pack_into('<I', signed, new_eocd + 16, cdoff + len(block))
          out.write_bytes(signed)
          digest = hashlib.sha256(signed).hexdigest()
          if digest != expected_signed:
              raise SystemExit(f'Signed APK digest mismatch: {digest}')
          print('Verified signed SHA-256:', digest)
          PY
          unzip -t Watch-It-v1.0.20-GitHub.apk >/dev/null
          echo '78006aa4a46c039aa866c00dd979546e208f5adbf6ce9ab8ecfb2c6e5fa57943  Watch-It-v1.0.20-GitHub.apk' | sha256sum -c -

      - name: Publish GitHub Release v1.0.20
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.20 >/dev/null 2>&1; then
            echo 'Release v1.0.20 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create v1.0.20 Watch-It-v1.0.20-GitHub.apk \
            --target main \
            --title 'Watch It! v1.0.20' \
            --notes 'Quality- und Stabilitätsrelease. Behebt den Kommentar-/Tastaturfokus, enthält die gehärtete Architektur und Datenvalidierung, verbessert Native Bridge/Teilen/Updater und wurde mit automatisierten Qualitäts-, Browser-, Firestore- und Android-Clean-Build-Gates sowie einem echten Upgrade-Test auf dem Gerät geprüft.' \
            --latest
